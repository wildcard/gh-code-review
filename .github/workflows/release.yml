name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cli/gh-extension-precompile@v2
        with:
          draft_release: true
          generate_attestations: true
          go_version_file: go.mod

  sbom:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: gh-code-review.spdx.json
          upload-artifact: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist
          (cd dist && sha256sum * > ../checksums.txt)
          gh release upload "$GITHUB_REF_NAME" gh-code-review.spdx.json checksums.txt --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --title "gh-code-review ${GITHUB_REF_NAME#v} — Public Preview"
